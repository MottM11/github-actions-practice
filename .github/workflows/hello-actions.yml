name: Hello Actions!

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "🎉 Hello GitHub Actions! 🎉"

      - name: Show the time
        run: date

      - name: Show system info
        run: uname -a

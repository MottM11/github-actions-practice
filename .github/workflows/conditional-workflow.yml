name: 条件分岐で遊ぶ

on:
  push:
    branches:
      - main

jobs:
  simple-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello with conditional
        run: |
          echo "🚀 このワークフローが実行されました！"
          if [ -f "README.md" ]; then
            echo "✅ README.md が存在します"
          else
            echo "❌ README.md がありません"
          fi

      - name: List all files
        run: |
          echo "📋 リポジトリ内のファイル："
          ls -la

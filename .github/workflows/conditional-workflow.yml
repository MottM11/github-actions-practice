name: 条件分岐で遊ぶ

on:
  push:
    branches:
      - main

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if README changed
        run: |
          if git diff HEAD~1 HEAD --name-only | grep -q "README.md"; then
            echo "📖 README.md が変更されました！"
          else
            echo "📄 README.md は変更されていません"
          fi

      - name: List changed files
        run: |
          echo "🔍 変更されたファイル："
          git diff HEAD~1 HEAD --name-only
